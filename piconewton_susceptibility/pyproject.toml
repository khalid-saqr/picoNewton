[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piconewton-susceptibility"
version = "0.10.0"
description = "Waveform-susceptibility successor for anisotropic Womersley flow"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Khalid M. Saqr"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "h5py>=3.10",
  "nbformat>=5.9",
  "nbclient>=0.9",
  "threadpoolctl>=3.5"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.scripts]
piconewton-susceptibility-bootstrap = "piconewton_susceptibility.bootstrap:main"
piconewton-susceptibility-step3 = "piconewton_susceptibility.cli:main"
piconewton-susceptibility-step4 = "piconewton_susceptibility.step4_cli:main"
piconewton-susceptibility-step5 = "piconewton_susceptibility.step5_cli:main"
piconewton-susceptibility-step6 = "piconewton_susceptibility.step6_cli:main"
piconewton-susceptibility-step7 = "piconewton_susceptibility.step7_cli:main"
piconewton-susceptibility-step8 = "piconewton_susceptibility.step8_cli:main"
piconewton-susceptibility-step9 = "piconewton_susceptibility.step9_cli:main"
piconewton-susceptibility-step10 = "piconewton_susceptibility.step10_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piconewton_susceptibility = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/piconewton_susceptibility/publication_core.py" = ["I001"]
"src/piconewton_susceptibility/publication_figures.py" = ["E501"]
"src/piconewton_susceptibility/publication_tables.py" = ["E501", "E702", "I001"]
"src/piconewton_susceptibility/publication_workflow.py" = ["E501", "F401", "I001"]
"src/piconewton_susceptibility/step10_cli.py" = ["E501"]
"tests/step10_fixture.py" = ["E501", "E702", "F401", "I001"]
