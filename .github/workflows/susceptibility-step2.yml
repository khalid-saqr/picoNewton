name: susceptibility-step2

on:
  push:
    branches:
      - successor/scirep-waveform-susceptibility
    paths:
      - "piconewton_susceptibility/**"
      - ".github/workflows/susceptibility-step2.yml"
  pull_request:
    paths:
      - "piconewton_susceptibility/**"
      - ".github/workflows/susceptibility-step2.yml"

jobs:
  validate-step2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install parent and successor packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./picoNewton_v3"
          python -m pip install -e "./piconewton_susceptibility[dev]"
      - name: Static checks
        run: |
          ruff check piconewton_susceptibility
          python -m compileall -q piconewton_susceptibility/src piconewton_susceptibility/tests
      - name: Unit and contract tests
        run: pytest piconewton_susceptibility/tests
      - name: Execute Step 2 notebook locally
        run: python piconewton_susceptibility/scripts/execute_step2_notebook.py
      - name: Upload executed notebook and closure records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-validation-py${{ matrix.python-version }}
          path: |
            piconewton_susceptibility/notebooks/_executed_step2_ci.ipynb
            piconewton_susceptibility_outputs/bootstrap/step2/
          if-no-files-found: error
