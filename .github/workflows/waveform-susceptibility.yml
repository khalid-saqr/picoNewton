name: waveform-susceptibility

on:
  push:
    branches: [main]
    paths:
      - "waveform_susceptibility/**"
      - ".github/workflows/waveform-susceptibility.yml"
  pull_request:
    paths:
      - "waveform_susceptibility/**"
      - ".github/workflows/waveform-susceptibility.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./picoNewton_v3"
          python -m pip install -e "./waveform_susceptibility[dev]"
      - name: Static checks and tests
        run: |
          ruff check waveform_susceptibility/src waveform_susceptibility/tests
          python -m compileall -q waveform_susceptibility/src waveform_susceptibility/tests
          pytest waveform_susceptibility/tests
      - name: Numerical solver check
        run: |
          python - <<'PY'
          from piconewton_v3 import V2_ARTERY_CASES
          from piconewton_waveform_susceptibility import AnalysisConfig, derive_hierarchy

          result = derive_hierarchy(
              V2_ARTERY_CASES[-1],
              AnalysisConfig(radial_order=40, time_points=128, quadrature_nodes=16),
          )
          assert result.maximum_residual < 1e-10
          PY
      - name: Complete analysis check
        if: matrix.python-version == '3.11'
        run: |
          OUTPUT="$RUNNER_TEMP/waveform-susceptibility"
          piconewton-waveform-susceptibility \
            --output "$OUTPUT" \
            --radial-order 40 \
            --time-points 128 \
            --quadrature-nodes 16 \
            --validation-epsilon 0.04 \
            --figure-dpi 300
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("${{ runner.temp }}") / "waveform-susceptibility"
          summary = json.loads((root / "analysis_summary.json").read_text())
          figures = json.loads((root / "figures/figure_manifest.json").read_text())
          assert summary["arteries"] == 6
          assert summary["crossed_entries"] == 72
          assert figures["figure_count"] == 6
          for extension in ("pdf", "svg", "png"):
              assert len(list((root / "figures").glob(f"figure_[1-6]_*.{extension}"))) == 6
          PY
